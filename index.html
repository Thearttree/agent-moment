<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDFCE8">
<title>创作者的 Agent 时刻 · 访谈</title>
<style>
  :root{
    --cream:#FDFCE8;
    --lime:#DCE890;
    --lime-l:#EDF2C4;
    --green:#8CB850;
    --green-d:#6FA83C;
    --mint:#7CC49C;
    --teal:#00897A;
    --ink:#0B3A42;
    --ink-soft:#2C4A4F;
    --body:#1A1A1A;
    --muted:#7A7A72;
    --line:#E6E6DF;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--white);color:var(--body);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }

  .top{flex:none;padding:16px 22px 0;}
  .top .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .mark{font-size:11px;letter-spacing:.16em;color:var(--teal);font-weight:600;}
  .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .track{height:3px;background:#EFEFE7;border-radius:99px;overflow:hidden;}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--green));transition:width .45s cubic-bezier(.4,0,.2,1);}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;overflow-y:auto;}
  .card{width:100%;max-width:560px;animation:in .42s cubic-bezier(.22,1,.36,1) both;}
  @keyframes in{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .card.back{animation:backIn .42s cubic-bezier(.22,1,.36,1) both;}
  @keyframes backIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}

  .qnum{font-size:11px;letter-spacing:.18em;color:var(--green-d);margin-bottom:12px;font-weight:600;}
  h1{font-size:clamp(26px,7vw,36px);line-height:1.32;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
  h2{font-size:clamp(20px,5.4vw,25px);line-height:1.45;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  .hint{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.7;}

  .lead{margin-top:18px;font-size:14.5px;color:var(--ink-soft);line-height:1.9;}
  .meta{
    margin-top:22px;padding:15px 17px;background:var(--cream);
    border-left:3px solid var(--mint);font-size:12.5px;color:var(--ink-soft);line-height:1.95;
  }
  .meta b{color:var(--ink);}
  .warn{
    margin-top:14px;padding:12px 15px;background:#FFF7E8;border-left:3px solid #E8B45C;
    font-size:12.5px;color:#7A5A22;line-height:1.85;
  }

  input[type=text],input[type=number],textarea{
    width:100%;border:1px solid var(--line);border-radius:4px;padding:13px 15px;
    font-family:inherit;font-size:15.5px;color:var(--body);background:var(--white);
    line-height:1.65;transition:.16s;margin-top:18px;
  }
  textarea{resize:none;min-height:120px;}
  input:focus,textarea:focus{outline:none;border-color:var(--mint);background:#FCFEFB;box-shadow:0 0 0 3px rgba(124,196,156,.14);}
  input::placeholder,textarea::placeholder{color:#C2C2B9;}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
  .opt{
    display:flex;align-items:center;gap:11px;padding:13px 15px;border:1px solid var(--line);
    border-radius:4px;cursor:pointer;font-size:14.5px;color:var(--body);transition:.15s;background:var(--white);
  }
  .opt:hover{border-color:var(--mint);background:#FCFEFB;}
  .opt input{
    appearance:none;width:17px;height:17px;border:1.5px solid #C9C9BE;border-radius:3px;
    flex:none;position:relative;cursor:pointer;background:var(--white);transition:.15s;
  }
  .opt input[type=radio]{border-radius:50%;}
  .opt input:checked{background:var(--green);border-color:var(--green);}
  .opt input[type=checkbox]:checked::after{
    content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .opt input[type=radio]:checked::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#fff;}
  .opt.on{border-color:var(--green);background:#F6FAEE;}

  .pair{display:flex;gap:12px;margin-top:18px;}
  .pair > div{flex:1;}
  .pair label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .pair input{margin-top:0;}

  /* 录音 */
  .rec{border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:16px;background:#FCFEFB;}
  .rec .rt{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:12px;}
  .recrow{display:flex;align-items:center;gap:12px;}
  .recbtn{
    appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;
    font-family:inherit;font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:4px;
    cursor:pointer;transition:.18s;flex:none;
  }
  .recbtn:hover{background:var(--teal);border-color:var(--teal);}
  .recbtn.live{background:#D4574A;border-color:#D4574A;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.72;}}
  .rectime{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}

  .uploader{
    margin-top:16px;border:1.5px dashed #CFD8C6;border-radius:6px;padding:22px 18px;
    text-align:center;cursor:pointer;transition:.18s;background:#FCFEFB;
  }
  .uploader:hover{border-color:var(--green);background:#F7FBF2;}
  .uploader .ic{font-size:22px;color:var(--green);line-height:1;}
  .uploader .t1{font-size:14px;color:var(--ink);margin-top:8px;font-weight:600;}
  .uploader .t2{font-size:12px;color:var(--muted);margin-top:5px;}
  .filelist{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .fitem{
    display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);
    border-radius:4px;font-size:12.5px;background:var(--white);
  }
  .fitem .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .fitem .fs{color:var(--muted);font-size:11px;flex:none;}
  .fitem button{
    appearance:none;border:0;background:none;color:#B5B5AC;font-size:16px;
    cursor:pointer;padding:0 2px;line-height:1;flex:none;
  }
  .fitem button:hover{color:#D4574A;}

  .foot{flex:none;padding:0 22px 26px;max-width:604px;width:100%;margin:0 auto;}
  .actions{display:flex;gap:10px;align-items:center;}
  .btn{
    flex:1;appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--white);
    font-family:inherit;font-size:15px;font-weight:600;padding:14px;border-radius:4px;
    cursor:pointer;transition:.2s;letter-spacing:.02em;
  }
  .btn:hover{background:var(--teal);border-color:var(--teal);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.prev{
    flex:none;width:auto;padding:14px 20px;background:var(--white);color:var(--muted);
    border-color:var(--line);font-weight:500;font-size:13.5px;
  }
  .btn.prev:hover{background:var(--cream);color:var(--ink);border-color:var(--mint);}
  .btn.prev.hide{display:none;}
  .note{text-align:center;font-size:11px;color:#BFBFB6;margin-top:12px;line-height:1.7;}

  .done{text-align:center;}
  .done .ck{
    width:58px;height:58px;border-radius:50%;background:var(--lime-l);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    color:var(--green-d);font-size:26px;
  }
  .done h2{font-size:24px;}
  .done p{color:var(--muted);font-size:14px;margin-top:14px;line-height:1.9;}
  .filebox{
    margin-top:20px;padding:15px 17px;background:var(--cream);border:1px solid var(--lime);
    border-radius:4px;text-align:left;font-size:13px;color:var(--ink-soft);line-height:1.9;
  }
  .filebox b{color:var(--ink);}
  .steps{margin-top:18px;text-align:left;}
  .step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);line-height:1.8;}
  .step:last-child{border-bottom:0;}
  .step .n{
    flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:3px;
  }
  .again{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-size:13px;padding:10px 16px;border-radius:4px;cursor:pointer;margin-top:16px;
  }
  .again:hover{border-color:var(--mint);background:var(--cream);}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:60;
    background:var(--ink);color:#fff;font-size:13px;padding:10px 20px;border-radius:4px;
    opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;max-width:88vw;
    overflow:hidden;text-overflow:ellipsis;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-height:640px){
    .stage{padding:14px 18px;}
    textarea{min-height:86px;}
    .opts{gap:7px;margin-top:14px;}
    .opt{padding:10px 13px;}
  }
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <span class="mark">创作者的 AGENT 时刻</span>
    <span class="count" id="count"></span>
  </div>
  <div class="track"><i id="bar"></i></div>
</div>

<div class="stage" id="stage"></div>

<div class="foot">
  <div class="actions">
    <button class="btn prev hide" id="prevBtn">上一页</button>
    <button class="btn" id="nextBtn">开始</button>
  </div>
  <div class="note" id="note">全程约 8 分钟 · 内容仅用于课程研究与专栏写作</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   问卷结构
   ========================================================= */
const STEPS = [
  {
    type:"cover",
    title:"聊聊你最近<br>用 AI 做的一个作品",
    lead:"我在做一个记录校园创作者怎么用 AI 做作品的专栏。这份访谈一共十几页，一页一题，大约 8 分钟。没有标准答案，写口语、写短句都行 —— 翻车的故事比成功案例更有意思。",
    meta:"<b>关于隐私：</b>内容只用于课程研究与专栏写作，不做商业用途。<br><b>关于署名：</b>最后一页你可以选实名、匿名，或先看稿子。<br><b>可以退出：</b>中途关掉不要紧，重新打开会自动接着填。",
    warn:"<b>如果你在微信里打开：</b>请先点右上角「···」→「在浏览器打开」。否则最后一步保存文件会失败。"
  },
  {id:"q1", type:"text", q:"怎么称呼你？", hint:"昵称就行，方便我写的时候知道叫你什么。", ph:"例：小林 / 阿 May / 树洞"},
  {
    id:"q2", type:"multi", q:"你的创作方向是？", hint:"可以多选。",
    opts:["文案 / 写作","平面设计 / 视觉","视频剪辑","摄影 / 拍摄","新媒体运营 / 账号","其他"]
  },
  {
    id:"q3", type:"single", q:"有过实习经历吗？", hint:"选最接近的一档。",
    opts:["还没有","1–3 个月","3–6 个月","半年以上"]
  },
  {
    id:"q4", type:"multi", q:"平时用哪些 AI 工具？", hint:"挑你真正打开过的，多选。",
    opts:["豆包 / DeepSeek / Kimi 等对话模型","剪映 / 必剪","即梦 / Midjourney / 可灵 等生图生视频","稿定 / Canva","Cursor / Claude Code 等写代码","其他"]
  },
  {
    id:"q5", type:"single", q:"大概多久用一次？",
    opts:["几乎每天","每周三四次","每周一两次","很少用，想起来才用"]
  },
  {id:"q6", type:"textarea", q:"最近做的一个作品是什么？", hint:"一句话说清就行：给社团做的一套招新海报 / 一条 3 分钟的探店视频 / 一篇小红书笔记。", ph:"我做的是……"},
  {
    id:"q7", type:"multi", q:"这个作品里，AI 具体帮你做了哪几步？", hint:"多选，也包括「它帮了倒忙」的那一步。",
    opts:["想选题 / 找角度","写初稿文案","改写成多平台版本","生成图片 / 视觉素材","改图 / 尺寸延展","剪视频 / 找镜头","加字幕 / 做封面","这个作品基本没用 AI"]
  },
  {id:"q8", type:"textarea", q:"哪一步你最后大幅返工了？改的是什么", hint:"没返工的话，写「没有，直接能交」也可以。", ph:"比如：它写的文案事实全是编的，我最后重写了整段……"},
  {
    id:"q9", type:"pair", q:"这一件，纯手动和用 AI 大概各要多久？", hint:"填分钟数，估个大概就行。",
    fields:[{k:"q9a", label:"纯手动（分钟）", ph:"180"},{k:"q9b", label:"用 AI 之后（分钟）", ph:"50"}]
  },
  {
    id:"q10", type:"single", q:"你会告诉别人这个作品用了 AI 吗？",
    opts:["会主动说，没什么好藏的","别人问才说","一般不说","分场合：对老师说会，对客户可能不说"]
  },
  {
    id:"q11", type:"multi", q:"AI 省下的时间，你实际拿去做什么了？", hint:"多选。这题我最好奇。",
    opts:["多做几个版本 / 多试几种方案","接更多活 / 多接一个客户","产出量被要求提高了","真的少熬夜了","学新东西 / 补短板","说实话没什么变化"]
  },
  {
    id:"q12", type:"single", q:"你的产出要求有没有跟着变高？",
    opts:["明显变高，原来一周一条，现在要三条","稍微高了一点","没变","我是自己做账号，要求自己定"]
  },
  {id:"q13", type:"textarea", q:"能举一个具体的例子吗？", hint:"选填，但这类细节最有用。比如某次因为有了 AI，你被要求当天交出三个版本。", ph:"有一次……", required:false},
  {
    id:"q14", type:"multi", limit:3, q:"哪些能力变得更值钱了？", hint:"最多选 3 项，凭直觉。",
    opts:["判断力，能挑出好的那一个","审美","事实核查，能发现它在瞎编","和客户 / 老师沟通","创意方向，知道要什么","会写提示词、会调工具"]
  },
  {
    id:"q15", type:"multi", limit:3, q:"哪些能力变得没那么重要了？", hint:"最多选 3 项。",
    opts:["软件操作熟练度","基础排版","写基础文案","粗剪","找素材","手绘 / 手工"]
  },
  {id:"q16", type:"textarea", q:"最近一次 AI 出错是什么情况？你怎么发现的", hint:"不用客气，翻车故事比成功案例更受欢迎。", ph:"有一次……我是这样发现的……"},
  {
    id:"q17", type:"single", q:"如果明天所有 AI 工具都不能用了，你会？",
    opts:["基本没法干活，产出会掉一大半","会慢很多，但还做得出来","没什么影响","反而更顺，不用再收拾烂摊子"]
  },
  {
    id:"q18", type:"single", q:"愿意让我把你的经历写进专栏吗？", hint:"选什么都不影响前面内容的用途。",
    opts:["可以，用昵称或真名都行","可以写，但请匿名","先给我看稿子，再决定","不想被公开，可以只用数据，不写我"]
  },
  {id:"q19", type:"text", q:"想让我顺手帮你引流的账号？", hint:"选填。写平台 + 账号名，我在文章结尾 @ 你。", ph:"小红书 @小林在做设计", required:false},
  {id:"q20", type:"text", q:"留个联系方式？", hint:"选填。微信或邮箱都行，只用来和你说稿子的事，不会公开。", ph:"微信号或邮箱", required:false},
  {id:"q21", type:"textarea", q:"还有什么想说的？", hint:"选填。吐槽、建议，或者你觉得我该问但没问的。", ph:"随便写……", required:false},
  {type:"upload"},
  {type:"done"}
];

/* =========================================================
   状态
   ========================================================= */
const KEY = "agent_moment_paged_v2";
let ans = {};
let attachments = [];
let idx = 0;

try{
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if(saved && saved.ans){
    ans = saved.ans;
    if(typeof saved.idx === "number") idx = Math.min(saved.idx, STEPS.length-3);
  }
}catch(e){}

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const countEl = document.getElementById("count");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const noteEl = document.getElementById("note");

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ans, idx})); }catch(e){}
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("on"), 2400);
}
function mb(n){ return (n/1024/1024).toFixed(1) + " MB"; }

/* =========================================================
   渲染
   ========================================================= */
function render(dir){
  const s = STEPS[idx];
  let html = "";

  if(s.type === "cover"){
    html = `<div class="card">
      <div class="qnum">访谈 · 约 8 分钟</div>
      <h1>${s.title}</h1>
      <p class="lead">${s.lead}</p>
      <div class="meta">${s.meta}</div>
      <div class="warn">${s.warn}</div>
    </div>`;
    countEl.textContent = "";
    bar.style.width = "2%";
    prevBtn.classList.add("hide");
    nextBtn.textContent = "开始";
    nextBtn.style.display = "";
    noteEl.style.display = "block";
  }
  else if(s.type === "done"){
    html = `<div class="card done">
      <div class="ck">✓</div>
      <h2>你的表单已经生成</h2>
      <p>最后一步：把文件发回给我，我这边就能直接看到你的回答和语音。</p>
      <div class="filebox">
        <div>文件名：<b id="doneName">—</b></div>
      </div>
      <div class="steps">
        <div class="step"><span class="n">1</span><span>点下面的「保存表单文件」，存到手机或电脑里</span></div>
        <div class="step"><span class="n">2</span><span>回到微信，把这个文件直接发给我</span></div>
        <div class="step"><span class="n">3</span><span>看到我回复「收到」就结束了，谢谢你的时间</span></div>
      </div>
      <button class="again" id="againBtn">重新保存一次</button>
      <p style="margin-top:16px;font-size:12px;color:#BFBFB6">文件里只有你的回答和上传的语音，没有别的东西</p>
    </div>`;
    countEl.textContent = "";
    bar.style.width = "100%";
    prevBtn.classList.add("hide");
    nextBtn.style.display = "none";
    noteEl.style.display = "none";
    requestAnimationFrame(()=>{
      const n = document.getElementById("doneName");
      if(n) n.textContent = window.__lastFileName || "—";
      const b = document.getElementById("againBtn");
      if(b) b.onclick = ()=> downloadPayload();
    });
  }
  else if(s.type === "upload"){
    html = `<div class="card">
      <div class="qnum">最后一步</div>
      <h2>有语音想跟我说？</h2>
      <p class="hint">可以在这里直接录音，也可以上传已经录好的语音、作品截图或成片。不传也能生成表单文件。</p>
      <div class="rec" id="recBox" style="display:none">
        <div class="rt">录一段想说的话：比如刚才哪题没写清、或者你觉得我该问但没问的。</div>
        <div class="recrow">
          <button class="recbtn" id="recBtn">开始录音</button>
          <span class="rectime" id="recTime">00:00</span>
        </div>
      </div>
      <div class="uploader" id="drop">
        <div class="ic">↑</div>
        <div class="t1">点这里选择文件</div>
        <div class="t2">语音 / 图片 / 视频都可以</div>
      </div>
      <input type="file" id="fileInput" multiple accept="audio/*,image/*,video/*" style="display:none">
      <div class="filelist" id="fileList"></div>
    </div>`;
    prevBtn.classList.remove("hide");
    nextBtn.textContent = "生成我的表单文件";
    countEl.textContent = "生成文件";
    bar.style.width = "98%";
    noteEl.style.display = "block";
    requestAnimationFrame(wireUpload);
  }
  else{
    html = `<div class="card ${dir==='back'?'back':''}">
      <div class="qnum">${String(idx).padStart(2,"0")} / ${STEPS.length-2}</div>
      <h2>${esc(s.q)}</h2>
      ${s.hint ? `<p class="hint">${s.hint}</p>` : ""}
      ${bodyFor(s)}
    </div>`;
    const pct = Math.min(97, Math.round(idx / (STEPS.length-2) * 100));
    bar.style.width = pct + "%";
    countEl.textContent = idx + " / " + (STEPS.length - 2);
    prevBtn.classList.remove("hide");
    nextBtn.textContent = "下一页";
    nextBtn.style.display = "";
    noteEl.style.display = "block";
    requestAnimationFrame(()=>wireInputs(s));
  }

  stage.innerHTML = html;
  stage.scrollTop = 0;
  save();
}

function bodyFor(s){
  if(s.type === "text"){
    return `<input type="text" id="f_${s.id}" value="${esc(ans[s.id]||"")}" placeholder="${s.ph||""}">`;
  }
  if(s.type === "textarea"){
    return `<textarea id="f_${s.id}" placeholder="${s.ph||""}">${esc(ans[s.id]||"")}</textarea>`;
  }
  if(s.type === "pair"){
    return `<div class="pair">${s.fields.map(f=>`
      <div><label>${f.label}</label>
      <input type="number" inputmode="numeric" id="f_${f.k}" value="${esc(ans[f.k]||"")}" placeholder="${f.ph}"></div>`).join("")}</div>`;
  }
  if(s.type === "multi" || s.type === "single"){
    const cur = s.type === "multi" ? (ans[s.id] || []) : (ans[s.id] || "");
    return `<div class="opts" data-mode="${s.type}" data-id="${s.id}" ${s.limit?`data-limit="${s.limit}"`:""}>
      ${s.opts.map((o)=>{
        const on = s.type === "multi" ? cur.includes(o) : cur === o;
        return `<label class="opt ${on?'on':''}">
          <input type="${s.type==='multi'?'checkbox':'radio'}" name="${s.id}" value="${esc(o)}" ${on?'checked':''}>
          <span>${esc(o)}</span></label>`;
      }).join("")}
    </div>`;
  }
  return "";
}

function wireInputs(s){
  if(s.type === "text" || s.type === "textarea"){
    const el = document.getElementById("f_" + s.id);
    if(!el) return;
    el.addEventListener("input", ()=>{ ans[s.id] = el.value.trim(); save(); });
  }
  if(s.type === "pair"){
    s.fields.forEach(f=>{
      const el = document.getElementById("f_" + f.k);
      if(el) el.addEventListener("input", ()=>{ ans[f.k] = el.value.trim(); save(); });
    });
  }
  if(s.type === "multi" || s.type === "single"){
    const wrap = document.querySelector(`.opts[data-id="${s.id}"]`);
    if(!wrap) return;
    wrap.querySelectorAll("input").forEach(input=>{
      input.addEventListener("change", ()=>{
        const labels = wrap.querySelectorAll(".opt");
        if(s.type === "single"){
          ans[s.id] = input.value;
          labels.forEach(l=>l.classList.toggle("on", l.querySelector("input").checked));
        } else {
          const limit = parseInt(wrap.dataset.limit || "0", 10);
          const checked = wrap.querySelectorAll("input:checked");
          if(limit && checked.length > limit){
            input.checked = false;
            toast("最多选 " + limit + " 项");
            return;
          }
          ans[s.id] = Array.from(wrap.querySelectorAll("input:checked")).map(i=>i.value);
          labels.forEach(l=>l.classList.toggle("on", l.querySelector("input").checked));
        }
        save();
      });
    });
  }
}

/* =========================================================
   上传 + 录音
   ========================================================= */
let recorder = null, recChunks = [], recTimer = null, recStart = 0;

function wireUpload(){
  const drop = document.getElementById("drop");
  const input = document.getElementById("fileInput");
  if(!drop || !input) return;

  drop.onclick = ()=> input.click();
  input.onchange = ()=>{
    const incoming = Array.from(input.files || []);
    for(const f of incoming){
      if(attachments.length >= 4){ toast("最多 4 个文件"); break; }
      if(f.size > 25 * 1024 * 1024){ toast(f.name + " 超过 25MB"); continue; }
      attachments.push(f);
    }
    input.value = "";
    renderFiles();
  };

  const recBox = document.getElementById("recBox");
  const recBtn = document.getElementById("recBtn");
  const recTime = document.getElementById("recTime");

  if(navigator.mediaDevices && window.MediaRecorder){
    recBox.style.display = "block";
    recBtn.onclick = async ()=>{
      if(recorder && recorder.state === "recording"){
        recorder.stop();
        return;
      }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        recChunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
        recorder.onstop = ()=>{
          stream.getTracks().forEach(t=>t.stop());
          clearInterval(recTimer);
          recBtn.textContent = "开始录音";
          recBtn.classList.remove("live");
          const type = recorder.mimeType || "audio/webm";
          const blob = new Blob(recChunks, { type });
          const ext = type.includes("mp4") ? "m4a" : (type.includes("ogg") ? "ogg" : "webm");
          const name = "语音_" + new Date().toISOString().slice(11,19).replace(/:/g,"") + "." + ext;
          attachments.push(new File([blob], name, { type }));
          renderFiles();
          toast("录音已添加");
        };
        recorder.start();
        recStart = Date.now();
        recBtn.textContent = "停止录音";
        recBtn.classList.add("live");
        recTimer = setInterval(()=>{
          const s = Math.floor((Date.now()-recStart)/1000);
          recTime.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
          if(s >= 300) recorder.stop();
        }, 400);
      }catch(err){
        recBox.style.display = "none";
        toast("麦克风打不开，可以直接上传语音文件");
      }
    };
  }

  renderFiles();
}

function renderFiles(){
  const box = document.getElementById("fileList");
  if(!box) return;
  box.innerHTML = attachments.map((f,i)=>`
    <div class="fitem">
      <span class="fn">${esc(f.name)}</span>
      <span class="fs">${mb(f.size)}</span>
      <button data-i="${i}" title="移除">×</button>
    </div>`).join("");
  box.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      attachments.splice(parseInt(b.dataset.i,10), 1);
      renderFiles();
    };
  });
}

/* =========================================================
   校验与翻页
   ========================================================= */
function valid(s){
  if(s.type === "cover" || s.type === "upload" || s.type === "done") return true;
  if(s.required === false) return true;

  if(s.type === "text" || s.type === "textarea"){
    if(!(ans[s.id] || "").trim()){ toast("这一题还没填"); return false; }
    return true;
  }
  if(s.type === "pair"){
    if(!(ans.q9a || "").trim() || !(ans.q9b || "").trim()){ toast("两个数都填一下，估个大概就行"); return false; }
    return true;
  }
  if(s.type === "multi"){
    if(!(ans[s.id] || []).length){ toast("至少选一项"); return false; }
    return true;
  }
  if(s.type === "single"){
    if(!ans[s.id]){ toast("选一项再继续"); return false; }
    return true;
  }
  return true;
}

prevBtn.onclick = ()=>{ if(idx > 0){ idx--; render("back"); } };

nextBtn.onclick = async ()=>{
  const s = STEPS[idx];
  if(!valid(s)) return;

  if(s.type === "upload"){
    await downloadPayload();
    return;
  }
  idx++;
  render("next");
};

/* =========================================================
   生成表单文件
   ========================================================= */
function readAsDataURL(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
    r.readAsDataURL(file);
  });
}

let cachedId = null;

function usableQuestions(){
  return STEPS
    .filter(s=> s.id)
    .map(s=>({
      id:s.id, type:s.type, q:s.q,
      opts:s.opts || null,
      fields:s.fields ? s.fields.map(f=>({k:f.k,label:f.label})) : null
    }));
}

async function buildPayload(){
  const items = [];
  for(const f of attachments){
    const data = await readAsDataURL(f);
    items.push({ name:f.name, type:f.type || "application/octet-stream", size:f.size, data });
  }
  const name = (ans.q1 || "匿名").trim().slice(0, 20);
  return {
    schema: "agent-moment-interview/1",
    id: cachedId || (cachedId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2))),
    createdAt: new Date().toISOString(),
    name,
    answers: ans,
    questions: usableQuestions(),
    attachments: items,
    meta: {
      ua: navigator.userAgent,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      page: location.href
    }
  };
}

function fileStamp(){
  const d = new Date();
  const p = n=> String(n).padStart(2,"0");
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
}

async function downloadPayload(){
  nextBtn.disabled = true;
  const old = nextBtn.textContent;
  nextBtn.textContent = "正在打包…";
  try{
    const payload = await buildPayload();
    const json = JSON.stringify(payload);
    const blob = new Blob([json], { type:"application/json" });

    if(blob.size > 40 * 1024 * 1024){
      toast("文件太大了，删掉一两个大附件再试");
      nextBtn.disabled = false;
      nextBtn.textContent = old;
      return;
    }

    const safe = (payload.name || "匿名").replace(/[\\/:*?"<>|\s]/g, "_").slice(0, 16);
    const fileName = "访谈_" + safe + "_" + fileStamp() + ".json";
    window.__lastFileName = fileName;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);

    try{ localStorage.removeItem(KEY); }catch(e){}

    idx = STEPS.length - 1;
    render("next");
  }catch(err){
    toast("生成失败，可能是文件太大，删掉一个再试");
    nextBtn.disabled = false;
    nextBtn.textContent = old;
  }
}

/* 键盘 */
document.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    const t = document.activeElement;
    if(t && t.tagName === "TEXTAREA") return;
    if(!nextBtn.disabled) nextBtn.click();
  }
});

render("next");
</script>
